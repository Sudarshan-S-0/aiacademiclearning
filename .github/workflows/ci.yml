name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: academic
          POSTGRES_PASSWORD: academic
          POSTGRES_DB: academic
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U academic -d academic"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Test backend
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://academic:academic@localhost:5432/academic
          JWT_SECRET: ci-test-secret-0123456789-abcdef-123456
          CORS_ORIGINS: http://localhost:5173
          PYTHONPATH: .
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package.json
      - working-directory: frontend
        run: npm install
      - working-directory: frontend
        run: npm run build
